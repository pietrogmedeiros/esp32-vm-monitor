; ESP32 VM Monitor — PlatformIO
; Placa: ESP32-2432S028 "Cheap Yellow Display" (CYD)
;        ESP32-WROOM-32 + TFT 2.8" ILI9341 320x240 + touch XPT2046 + CH340C
;
;   pio run -t upload -t monitor       compila, grava e abre o monitor serial
;   pio run -t monitor                 so abre o monitor serial
;   pio device list                    lista as portas seriais
;
; IMPORTANTE: grave pela porta MICRO-USB da placa. A USB-C dessa CYD nao tem os
; resistores de 5.1k nos pinos CC, entao ela nao funciona com cabo USB-C -> USB-C.

[env:cyd]
platform  = espressif32
board     = esp32dev          ; o modulo e um ESP32-WROOM-32 comum
framework = arduino

; O padrao reserva 1.31 MB para a aplicacao e ja estava em 80% com a pilha TLS
; mais o TFT_eSPI. huge_app da 3 MB (abre mao de OTA, que nao usamos).
board_build.partitions = huge_app.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 460800

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    bodmer/TFT_eSPI@^2.5.43
    ; No registro do PlatformIO esta biblioteca so existe como snapshot sem
    ; versao semver ("0.0.0-alpha+sha..."), entao apontamos direto para o repo.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINOJSON_ENABLE_COMMENTS=0

    ; --- TFT_eSPI: configuracao da CYD por flags ---------------------------
    ; Assim nao e preciso editar User_Setup.h dentro da biblioteca, que seria
    ; sobrescrito a cada reinstalacao das dependencias.
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1      ; se as cores sairem invertidas, troque por -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

; Descomente se a placa nao for detectada automaticamente:
; upload_port  = /dev/cu.usbserial-0001
; monitor_port = /dev/cu.usbserial-0001
